<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef5fb">
  <meta name="description" content="PLAN 2.0 — organiza, enfoca, actúa, logra.">
  <meta name="application-name" content="PLAN 2.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PLAN 2.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./public/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="stylesheet" href="./src/styles.css">
  <title>PLAN 2.0</title>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-mark">P2</div>
      <strong>PLAN 2.0</strong>
      <span>Organiza · Enfoca · Actúa · Logra</span>
    </div>
  </div>
  <noscript><div class="fatal-card"><h1>JavaScript está desactivado</h1><p>PLAN 2.0 necesita JavaScript para funcionar.</p></div></noscript>
  <script type="module" src="./src/app.js"></script>
  <script>
    setTimeout(function(){
      var app=document.getElementById('app');
      if(app && app.querySelector('.boot-screen')){
        app.innerHTML='<div class="fatal-card"><h1>PLAN 2.0 no pudo cargar</h1><p>El navegador no terminó de cargar el módulo de la aplicación. Revisa que estés usando la URL de GitHub Pages o un servidor local, no el archivo index.html abierto directamente.</p><button class="primary-btn" onclick="location.reload()">Recargar</button></div>';
      }
    },5000);
  </script>
</body>
</html>
