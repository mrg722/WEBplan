<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef5fb">
  <meta name="description" content="PLAN 2.0 — organiza, enfoca, actúa, logra.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PLAN 2.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./public/icons/icon.svg" type="image/svg+xml">
  <title>PLAN 2.0</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <noscript>PLAN 2.0 necesita JavaScript habilitado para funcionar.</noscript>
  <div id="app"></div>
  <script>
    window.PLAN20_CONFIG = { vapidPublicKey: "" };
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function(err) {
        console.warn("PLAN 2.0: no se pudo registrar el service worker", err);
      });
    }
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
